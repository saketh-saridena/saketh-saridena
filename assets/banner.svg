<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Saketh Saridena</title>
  <desc id="d">AI engineer and data scientist. Governed multi-agent systems on Azure Databricks with LangGraph, MLflow and Unity Catalog.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b33"/><stop offset="1" stop-color="#16367a"/></linearGradient>
    <style>
      .node { fill: #7cc4ff; }
      .edge { stroke: #7cc4ff; stroke-width: 3; opacity: .45; fill: none; }
      @media (prefers-reduced-motion: no-preference) {
        .node { animation: glow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        .n2 { animation-delay: .4s; } .n3 { animation-delay: .8s; } .n4 { animation-delay: 1.2s; } .n5 { animation-delay: 1.6s; } .n6 { animation-delay: 2s; }
      }
      @keyframes glow { 0%, 100% { opacity: .45; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    </style>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <g transform="translate(96 88)">
