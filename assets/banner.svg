  </g>
  <text x="300" y="150" fill="#ffffff" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-1">Saketh Saridena</text>
  <text x="302" y="200" fill="#c7d6ee" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="26">AI engineer and data scientist  ·  Redmond, WA</text>
  <text x="302" y="236" fill="#7cc4ff" font-family="Segoe UI, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="20">Governed multi-agent systems on Azure Databricks  ·  LangGraph  ·  MLflow  ·  Unity Catalog</text>
